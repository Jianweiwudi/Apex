<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apex</title>
<!-- Same reason as index.html: WebView2 asks for /favicon.ico on every load and the virtual
     host serves ui, which has no such file, so this page logged "Failed to load resource:
     net::ERR_FILE_NOT_FOUND" on every first run. The window icon comes from the exe. -->
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#0B0F14; --card:#121821; --bd:#1E2836; --tx:#E8EEF6; --tx2:#9FB0C4; --tx3:#6B7C90;
    --ok:#2BE8B0; --bad:#FF5470; --warn:#FF9F43;
  }
  [data-theme="light"]{
    --bg:#F3F6FA; --card:#FFFFFF; --bd:#DCE4EE; --tx:#101827; --tx2:#4A5A6E; --tx3:#8595A8;
    --ok:#0E9E78; --bad:#DC2626; --warn:#D97706;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--tx);
       font:14px/1.65 "Segoe UI","Microsoft JhengHei","Microsoft YaHei",system-ui,sans-serif;
       display:flex;align-items:center;justify-content:center;padding:18px}
  .wrap{width:min(880px,100%);height:100%;max-height:760px;background:var(--card);
        border:1px solid var(--bd);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;
        box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .head{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--bd)}
  .logo{width:38px;height:38px;border-radius:11px;flex:0 0 auto;
        background:linear-gradient(145deg,var(--ok),color-mix(in srgb,var(--ok) 55%, #000));
        display:flex;align-items:center;justify-content:center}
  .logo svg{width:22px;height:22px;fill:none;stroke:#04140F;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  h1{margin:0;font-size:16px;font-weight:650;letter-spacing:.2px}
  .ver{font-size:11.5px;color:var(--tx3);margin-top:2px}
  .intro{padding:14px 22px 0;color:var(--tx2);font-size:13px}
  .body{flex:1;overflow:auto;padding:14px 22px 6px}
  .sec{margin:0 0 14px;padding:13px 15px;border:1px solid var(--bd);border-radius:11px;background:color-mix(in srgb,var(--card) 82%, var(--bg))}
  .sec h3{margin:0 0 7px;font-size:13.5px;font-weight:650;color:var(--tx)}
  .sec p{margin:0;white-space:pre-wrap;color:var(--tx2);font-size:12.5px;line-height:1.72}
  .foot{margin:6px 22px 0;padding:12px 0 0;border-top:1px solid var(--bd);color:var(--tx3);font-size:12px}
  .actions{display:flex;align-items:center;gap:10px;padding:14px 22px 18px;border-top:1px solid var(--bd)}
  .statusline{margin-right:auto;font-size:12.5px;color:var(--tx3);opacity:0;
              transform:translateY(3px);transition:opacity .22s ease,transform .22s ease}
  .statusline.on{opacity:1;transform:none}
  /* The two ways out move in opposite directions on purpose: agreeing goes INTO the app,
     refusing goes out of it, and the motion should say which one happened before the window
     changes at all. */
  .wrap{transition:opacity .3s ease,transform .3s cubic-bezier(.4,0,.2,1),filter .3s ease}
  body.leaving-ok .wrap{opacity:0;transform:scale(1.035) translateY(-6px);filter:blur(3px);transition-delay:.28s}
  body.leaving-no .wrap{opacity:0;transform:scale(.965) translateY(10px);filter:blur(3px);transition-delay:.06s}
  body.leaving-ok,body.leaving-no{pointer-events:none}
  /* the tick draws itself across the label's place rather than pushing it aside */
  #agree .tick{width:17px;height:17px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2.6;
               stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26;
               margin-right:-17px;opacity:0;
               transition:stroke-dashoffset .34s cubic-bezier(.65,0,.35,1) .05s,opacity .1s,
                          margin-right .26s cubic-bezier(.4,0,.2,1)}
  #agree .lbl{transition:opacity .16s ease,transform .16s ease}
  body.leaving-ok #agree .tick{stroke-dashoffset:0;opacity:1;margin-right:0}
  body.leaving-ok #agree .lbl{opacity:0;transform:translateY(-9px)}
  body.leaving-no #reject{opacity:.45}
  .btn[disabled]{cursor:default}
  @media (prefers-reduced-motion: reduce){
    .wrap,#agree .tick,#agree .lbl,.statusline{transition-duration:.01ms !important;transition-delay:0s !important}
  }
  .btn{appearance:none;border:1px solid var(--bd);background:transparent;color:var(--tx);
       padding:10px 22px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;
       font-family:inherit;transition:transform .12s,box-shadow .18s,background .18s}
  .btn:hover{transform:translateY(-1px)}
  .btn.primary{background:var(--ok);border-color:var(--ok);color:#04140F;
               box-shadow:0 6px 18px color-mix(in srgb,var(--ok) 32%, transparent)}
  .btn.ghost:hover{border-color:var(--bad);color:var(--bad)}
  .warnbox{margin:14px 22px 0;padding:11px 14px;border-radius:10px;font-size:12.5px;
           border:1px solid color-mix(in srgb,var(--warn) 45%, var(--bd));
           background:color-mix(in srgb,var(--warn) 10%, transparent);color:var(--tx2)}
  ::-webkit-scrollbar{width:9px}
  ::-webkit-scrollbar-thumb{background:var(--bd);border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 3.2 20.4 20H3.6z"/><path d="M8.2 15.4h7.6"/></svg></div>
    <div><h1 id="title">使用许可与免责声明</h1><div class="ver" id="ver"></div></div>
  </div>
  <div class="warnbox" id="warnbox"></div>
  <div class="intro" id="intro"></div>
  <div class="body" id="sections"></div>
  <div class="foot" id="foot"></div>
  <div class="actions">
    <span class="statusline" id="statusline" role="status" aria-live="polite"></span>
    <button class="btn ghost" id="reject"><span class="lbl">拒绝</span></button>
    <button class="btn primary" id="agree">
      <svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>
      <span class="lbl">同意</span>
    </button>
  </div>
</div>
<script>
(function(){
  var FALLBACK = {
    title:"使用许可与免责声明",
    intro:"声明文件缺失，无法加载完整条款。点击“同意”表示您接受本软件按“现状”提供、不附带任何担保，且您仅在离线单机模式下使用它。",
    sections:[
      {title:"离线使用",body:"本软件不得用于任何在线多人游戏；在联网对局中使用可能导致账号被封禁。"},
      {title:"隐私",body:"本软件不联网、不收集、不上传任何数据，全部配置仅保存在本机 %LOCALAPPDATA%\\Apex\\。"},
      {title:"免责",body:"修改游戏内存可能导致崩溃、存档损坏或封号；您自行承担全部风险。"}
    ],
    footer:"点击“同意”表示您已阅读并接受上述条款；点击“拒绝”将退出本程序。",
    agree:"同意", reject:"拒绝", version:"builtin-1"
  };
  function saved(){ try{ return JSON.parse(localStorage.getItem("actrainer.ui")||"{}"); }catch(e){ return {}; } }
  function code(){
    var s = saved(); var l = s.lang;
    if (l && l !== "auto") return l;
    var ls = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language||"en"];
    for (var i=0;i<ls.length;i++){
      var t = String(ls[i]).toLowerCase();
      if (t.indexOf("zh")!==0){ if (t.indexOf("en")===0) return "en"; continue; }
      if (/-(tw|hk|mo)\b/.test(t) || t.indexOf("hant")>=0) return "zh-Hant";
      return "zh-Hans";
    }
    return "en";
  }
  var S = saved();
  if (S.theme === "light") document.documentElement.setAttribute("data-theme","light");
  var WARN = { "zh-Hans":"⚠ 仅限单机 / 离线使用。严禁在 Low Fuel Motorsport（LFM）、PITSKILL.IO、Hipole、TVRL、PXN Pers 联赛、FullPush 等任何官方赛事或线上竞技平台使用，后果自负。",
               "zh-Hant":"⚠ 僅限單機 / 離線使用。嚴禁在 Low Fuel Motorsport（LFM）、PITSKILL.IO、Hipole、TVRL、PXN Pers 聯賽、FullPush 等任何官方賽事或線上競技平台使用，後果自負。",
               "en":"⚠ For single-player / offline use only. Strictly forbidden on any official competition or online racing platform, including Low Fuel Motorsport (LFM), PITSKILL.IO, Hipole, TVRL, PXN Pers and FullPush - at your own risk." };
  function send(o){ if (window.chrome && chrome.webview) chrome.webview.postMessage(JSON.stringify(o)); }
  function render(d){
    document.getElementById("title").textContent = d.title || "";
    document.getElementById("ver").textContent = "版本 " + (d.version||"") + (d.updated ? "  ·  " + d.updated : "");
    document.getElementById("intro").textContent = d.intro || "";
    document.getElementById("warnbox").textContent = WARN[code()] || WARN["en"];
    document.getElementById("foot").textContent = d.footer || "";
    // the labels live in their own spans now: the tick has to draw across the agree button's
    // text without the text being wiped when the label is rewritten
    document.querySelector("#agree .lbl").textContent = d.agree || "Agree";
    document.querySelector("#reject .lbl").textContent = d.reject || "Reject";
    var box = document.getElementById("sections");
    box.innerHTML = "";
    (d.sections||[]).forEach(function(s){
      var el = document.createElement("div"); el.className = "sec";
      var h = document.createElement("h3"); h.textContent = s.title || "";
      var p = document.createElement("p"); p.textContent = s.body || "";
      el.appendChild(h); el.appendChild(p); box.appendChild(el);
    });
  }
  /* The host navigates to index.html on accept and closes the window on reject, and it does
     both the instant the message arrives - so the animation has to finish BEFORE the send, not
     after it. A plain disabled button with no visible change would leave the user staring at a
     frozen dialog for the length of the animation, hence the status line. */
  var LEAVE = { "zh-Hans":{ ok:"已同意，正在进入…",     no:"已拒绝，正在退出…" },
                "zh-Hant":{ ok:"已同意，正在進入…",     no:"已拒絕，正在結束…" },
                "en":     { ok:"Accepted - entering…", no:"Declined - closing…" } };
  var busy = false;
  function leave(kind){
    if (busy) return;
    busy = true;
    document.getElementById("agree").disabled = true;
    document.getElementById("reject").disabled = true;
    var m = LEAVE[code()] || LEAVE["en"];
    var line = document.getElementById("statusline");
    line.textContent = (kind === "accept") ? m.ok : m.no;
    line.className = "statusline on";
    document.body.classList.add(kind === "accept" ? "leaving-ok" : "leaving-no");
    // Each way out waits exactly as long as its own transition runs. Reduced motion collapses
    // the transitions entirely, so waiting at all would just be a blank pause.
    //   accept: the tick draws until .39s and the card fades .28s -> .58s
    //   reject: the card fades .06s -> .36s
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var wait = reduce ? 80 : (kind === "accept" ? 620 : 420);
    setTimeout(function(){ send({ cmd:"consent", value: kind }); }, wait);
  }
  document.getElementById("agree").addEventListener("click", function(){ leave("accept"); });
  document.getElementById("reject").addEventListener("click", function(){ leave("reject"); });
  fetch("legal/"+code()+".json", { cache:"no-store" })
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){ render(d); })
    .catch(function(){ render(FALLBACK); });
})();
</script>
</body>
</html>
